services:

  postgres:
    build:
      context: .
      dockerfile: src/Postgres/Dockerfile
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${COURSE_POSTGRES_PASSWORD:-course-local-only}"
      COURSE_MIGRATOR_PASSWORD: "${COURSE_MIGRATOR_PASSWORD:-course-migrator-local-only}"
      COURSE_PUBLISHER_PASSWORD: "${COURSE_PUBLISHER_PASSWORD:-course-publication-local-only}"
      COURSE_RUNTIME_PASSWORD: "${COURSE_RUNTIME_PASSWORD:-course-runtime-local-only}"
      COURSE_WORKER_PASSWORD: "${COURSE_WORKER_PASSWORD:-workflow-worker-local-only}"
      COURSE_OUTBOX_PASSWORD: "${COURSE_OUTBOX_PASSWORD:-outbox-dispatcher-local-only}"
      COURSE_INBOX_PASSWORD: "${COURSE_INBOX_PASSWORD:-inbox-reconciler-local-only}"
    volumes:
      - course_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(cat /proc/1/comm)" = "postgres" &&
          pg_isready -U postgres -d course >/dev/null &&
          test "$$(PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U postgres -d course -Atqc "SELECT to_regprocedure('delivery.reconcile_inbox(integer)') IS NOT NULL")" = "t"
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      COURSE_DB_CONNECTION: >-
        Host=postgres;
        Port=5432;
        Database=course;
        Username=course_runtime;
        Password=${COURSE_RUNTIME_PASSWORD:-course-runtime-local-only}
      COURSE_JWT_ISSUER: "${COURSE_JWT_ISSUER}"
      COURSE_JWT_AUDIENCE: "${COURSE_JWT_AUDIENCE}"
      COURSE_JWT_SIGNING_KEY: "${COURSE_JWT_SIGNING_KEY}"
      PROVIDER_HMAC_SECRET: "${PROVIDER_HMAC_SECRET}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      API_BASE_URL: http://api:8080
      COURSE_JWT_ISSUER: "${COURSE_JWT_ISSUER}"
      COURSE_JWT_AUDIENCE: "${COURSE_JWT_AUDIENCE}"
      COURSE_JWT_SIGNING_KEY: "${COURSE_JWT_SIGNING_KEY}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
    ports:
      - "127.0.0.1:${COURSE_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - api

  cli:
    build:
      context: .
      dockerfile: src/Cli/Dockerfile
    command: ["bootstrap"]
    environment:
      COURSE_JWT_ISSUER: "${COURSE_JWT_ISSUER}"
      COURSE_JWT_AUDIENCE: "${COURSE_JWT_AUDIENCE}"
      COURSE_JWT_SIGNING_KEY: "${COURSE_JWT_SIGNING_KEY}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
      COURSE_DB_CONNECTION: >-
        Host=postgres;
        Port=5432;
        Database=course;
        Username=course_publication;
        Password=${COURSE_PUBLISHER_PASSWORD:-course-publication-local-only}
      COURSE_MIGRATION_DB_CONNECTION: >-
        Host=postgres;
        Port=5432;
        Database=course;
        Username=course_migrator;
        Password=${COURSE_MIGRATOR_PASSWORD:-course-migrator-local-only}
    depends_on:
      postgres:
        condition: service_healthy

  worker-a:
    image: moduledev-workflow-worker:local
    build:
      context: .
      dockerfile: src/Workflow.Worker/Dockerfile
    environment:
      COURSE_DB_CONNECTION: >-
        Host=postgres;
        Port=5432;
        Database=course;
        Username=workflow_worker;
        Password=${COURSE_WORKER_PASSWORD:-workflow-worker-local-only}
      WORKER_INSTANCE_ID: worker-a
      WORKFLOW_WORKER_SCOPES: "${WORKFLOW_WORKER_SCOPES:-payment:read,payment:write,payment:internal,workflow:execute}"
      COURSE_JWT_ISSUER: "${COURSE_JWT_ISSUER}"
      COURSE_JWT_AUDIENCE: "${COURSE_JWT_AUDIENCE}"
      COURSE_JWT_SIGNING_KEY: "${COURSE_JWT_SIGNING_KEY}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
      COURSE_FAILPOINT: "${COURSE_FAILPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy

  worker-b:
    image: moduledev-workflow-worker:local
    environment:
      COURSE_DB_CONNECTION: >-
        Host=postgres;
        Port=5432;
        Database=course;
        Username=workflow_worker;
        Password=${COURSE_WORKER_PASSWORD:-workflow-worker-local-only}
      WORKER_INSTANCE_ID: worker-b
      WORKFLOW_WORKER_SCOPES: "${WORKFLOW_WORKER_SCOPES:-payment:read,payment:write,payment:internal,workflow:execute}"
      COURSE_JWT_ISSUER: "${COURSE_JWT_ISSUER}"
      COURSE_JWT_AUDIENCE: "${COURSE_JWT_AUDIENCE}"
      COURSE_JWT_SIGNING_KEY: "${COURSE_JWT_SIGNING_KEY}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
      COURSE_FAILPOINT: "${COURSE_FAILPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy

  outbox-dispatcher:
    image: moduledev-python-perimeter:local
    build:
      context: .
      dockerfile: src/PythonPerimeter/Dockerfile
    command:
      - python
      - -m
      - perimeter.dispatcher
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: course
      PGUSER: outbox_dispatcher
      PGPASSWORD: "${COURSE_OUTBOX_PASSWORD:-outbox-dispatcher-local-only}"
      PROVIDER_URL: "${PROVIDER_URL:-http://provider-simulator:8081}"
      OUTBOX_OWNER: "${OUTBOX_OWNER:-outbox-dispatcher}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      provider-simulator:
        condition: service_started

  receipt-adapter:
    image: moduledev-python-perimeter:local
    command:
      - python
      - -m
      - perimeter.adapter
    environment:
      PORT: "8080"
      PROVIDER_CALLBACK_CAPABILITY: "${PROVIDER_CALLBACK_CAPABILITY}"
      PROVIDER_CALLBACK_TOKEN: "${PROVIDER_CALLBACK_TOKEN}"
      PROVIDER_HMAC_SECRET: "${PROVIDER_HMAC_SECRET}"
      RECEIPT_API_URL: "${RECEIPT_API_URL:-http://gateway:8080/api/receipt/accept}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
    depends_on:
      - gateway

  inbox-reconciler:
    image: moduledev-python-perimeter:local
    command:
      - python
      - -m
      - perimeter.reconciler
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: course
      PGUSER: inbox_reconciler
      PGPASSWORD: "${COURSE_INBOX_PASSWORD:-inbox-reconciler-local-only}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-0}"
    depends_on:
      postgres:
        condition: service_healthy

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0@sha256:70e5e0dd9ab8425be84de431ec74516f9bedf5d5529077358e2e2b2037fe0c74
    environment:
      CALLBACK_URL: "http://receipt-adapter:8080/callbacks/provider-v02/${PROVIDER_CALLBACK_CAPABILITY}"
      SIMULATOR_MODE: "${SIMULATOR_MODE:-success}"
      CALLBACK_DELAY: "${CALLBACK_DELAY:-200ms}"
      CALLBACK_TIMEOUT: "${CALLBACK_TIMEOUT:-1s}"
      CALLBACK_MAX_ATTEMPTS: "${CALLBACK_MAX_ATTEMPTS:-5}"
      CALLBACK_RETRY_DELAY: "${CALLBACK_RETRY_DELAY:-200ms}"
      AUDIT_TOKEN: "${PROVIDER_AUDIT_TOKEN}"
    depends_on:
      - receipt-adapter

volumes:
  course_postgres_data:
